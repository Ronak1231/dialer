<script src="https://app.ainvox.com/web-client/ainvox-dialer.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const client = (params.get("number") || "").trim();
const agent = (params.get("agent") || "").trim();

const ainvox = new AinvoxDialer();

function toIndiaE164(value) {
    var digits = String(value || "").replace(/\D/g, "");

    if (!digits) return "";

    if (digits.length === 11 && digits.charAt(0) === "0") {
        digits = digits.substring(1);
    }

    if (digits.length === 12 && digits.indexOf("91") === 0) {
        return "+" + digits;
    }

    if (digits.length === 10) {
        return "+91" + digits;
    }

    return "";
}

function wait(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
}

async function startCall() {
    try {
        const clientNumber = toIndiaE164(client);
        const agentNumber = toIndiaE164(agent);

        if (!clientNumber) {
            console.error("❌ Missing or invalid client number in URL param 'number'.");
            return;
        }

        if (!agentNumber) {
            console.error("❌ Missing or invalid agent number in URL param 'agent'.");
            return;
        }

        console.log("Opening dialer...");
        await ainvox.open();
        await wait(1000);

        console.log("Calling agent first...");
        await ainvox.call(agentNumber, true);

        await wait(5000);

        await ainvox.open();
        await wait(500);

        console.log("Calling client (auto)...");
        await ainvox.call(clientNumber, true);

    } catch (e) {
        console.error("Error:", e);
    }
}

// slight delay for iframe init
setTimeout(startCall, 1000);
</script>
