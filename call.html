<script src="https://app.ainvox.com/web-client/ainvox-dialer.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const client = (params.get("number") || "").trim();

// 👇 IMPORTANT: your agent number
const agent = "+918623977171";

const ainvox = new AinvoxDialer();

function normalizeNumber(value) {
    return String(value || "").replace(/[^0-9+]/g, "");
}

function wait(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
}

async function waitForDialerReady(timeoutMs = 12000) {
    return new Promise((resolve) => {
        let done = false;

        const cleanup = () => {
            window.removeEventListener("message", listener);
            clearTimeout(timer);
        };

        const finish = () => {
            if (done) return;
            done = true;
            cleanup();
            resolve();
        };

        const listener = (event) => {
            if (event.data && event.data.command === "ready") {
                console.log("✅ Dialer fully ready");
                finish();
            }
        };

        const timer = setTimeout(() => {
            console.warn("⏱ Ready event timeout. Proceeding with fallback delay.");
            finish();
        }, timeoutMs);

        window.addEventListener("message", listener);
    });
}

async function startCall() {
    try {
        const clientNumber = normalizeNumber(client);
        const agentNumber = normalizeNumber(agent);

        if (!clientNumber) {
            console.error("❌ Missing or invalid client number in URL param 'number'.");
            return;
        }

        if (!agentNumber) {
            console.error("❌ Invalid agent number.");
            return;
        }

        // Attach ready listener before open so we don't miss one-time ready signal.
        const readyPromise = waitForDialerReady();

        console.log("Opening dialer...");
        await ainvox.open();

        // Wait for actual ready event, with timeout fallback.
        await readyPromise;
        await wait(300);

        console.log("Calling agent first...");
        await ainvox.call(agentNumber, true);

        // Small delay after first leg
        await wait(5000);

        console.log("Calling client...");
        // second leg: add customer to bridge/dialer flow
        await ainvox.call(clientNumber, false);

    } catch (e) {
        console.error("Error:", e);
    }
}

// slight delay for iframe init
setTimeout(startCall, 1000);
</script>
