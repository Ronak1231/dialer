<script src="https://app.ainvox.com/web-client/ainvox-dialer.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const client = params.get("number");

// 👇 IMPORTANT: your agent number
const agent = "+918623977171";

const ainvox = new AinvoxDialer();

async function waitForDialerReady() {
    return new Promise((resolve) => {
        const listener = (event) => {
            if (event.data && event.data.command === "ready") {
                console.log("✅ Dialer fully ready");
                window.removeEventListener("message", listener);
                resolve();
            }
        };
        window.addEventListener("message", listener);
    });
}

async function startCall() {
    try {
        console.log("Opening dialer...");
        await ainvox.open();

        // 🔥 WAIT FOR REAL READY (NOT timeout)
        await waitForDialerReady();

        console.log("Calling agent first...");
        await ainvox.call(agent, true);

        // 👇 small delay AFTER agent call
        setTimeout(async () => {
            console.log("Calling client...");
            await ainvox.call(client, true);
        }, 5000);

    } catch (e) {
        console.error("Error:", e);
    }
}

// slight delay for iframe init
setTimeout(startCall, 1000);
</script>
